# CI for Product Catalog Service

name: product-catalog-dev-ci

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - closed

env:
  APP_NAME: product-catalog
  APP_PATH: src/product-catalog
  DOCKER_FILE: src/product-catalog/Dockerfile
  HELM_VALUES_FILE: helm/productcatalog/values-dev.yaml
  TARGET_BRANCH: dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: |
          cd ${{ env.APP_PATH }}
          go mod download
          go build -o product-catalog-service main.go

      - name: Unit Tests
        run: |
          cd ${{ env.APP_PATH }}
          go test ./...

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2
          working-directory: ${{ env.APP_PATH }}

  docker:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    needs:
      - build
#      - code-quality

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          file: ${{ env.DOCKER_FILE }}
          push: true
          tags: "${{ secrets.DOCKER_USERNAME }}/${{ env.APP_NAME }}:${{ github.run_id }}"

  updatehelm:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    needs: docker

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update Helm values file
        run: |
          sed -i 's|tag: .*|tag: "${{ github.run_id }}"|' "${{ env.HELM_VALUES_FILE }}"

      - name: Commit and push changes
        run: |
          git config --global user.email "nagalakshmi896@gmail.com"
          git config --global user.name "nagalakshmi"

          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git

          git add "${{ env.HELM_VALUES_FILE }}"

          git commit -m "CI: Update product catalog image tag" || true

          git push origin HEAD:${{ env.TARGET_BRANCH }}
